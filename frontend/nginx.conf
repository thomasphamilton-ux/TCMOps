server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes — fall back to index.html so a direct
    # visit or refresh on e.g. /dashboard doesn't 404 against the filesystem.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
